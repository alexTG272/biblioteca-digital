apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblioteca-digital-deployment
  labels:
    app: biblioteca-digital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biblioteca-digital
  template:
    metadata:
      labels:
        app: biblioteca-digital
    spec:
      containers:
      - name: biblioteca-digital-app
        # IMPORTANTE: Cambia "tu-usuario-docker" por tu usuario real de Docker Hub
        image: alextorres27/biblioteca-digital:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"