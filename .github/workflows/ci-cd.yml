name: Pipeline CI/CD - Biblioteca Digital

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Integración Continua: Construcción y Pruebas
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Entorno Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Se asignan permisos al wrapper para que GitHub Actions pueda ejecutarlo
      - name: Permitir ejecución al Maven Wrapper
        run: chmod +x mvnw

      # Ejecuta el archivo de pruebas unitarias visible en tu captura de pantalla
      - name: Ejecutar Pruebas Unitarias (JUnit)
        run: ./mvnw test

 # 2. Análisis de Seguridad con Bloqueo Automático
  security-analysis:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Entorno Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Permitir ejecución al Maven Wrapper
        run: chmod +x mvnw

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: Análisis de Vulnerabilidades con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

  # 3. Entrega y Despliegue Continuo Simulado
  deploy-environment:
    needs: security-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Recrea el entorno orquestado de contenedores de forma completamente trazable
      - name: Despliegue Automatizado (Docker Compose)
        run: docker compose up -d --build